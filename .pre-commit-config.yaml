default_language_version:
  python: python3.12

repos:
  - repo: local
    hooks:
      - id: no-google-maps-secrets-in-ui
        name: Block Google Maps secrets in ui/src
        entry: bash -c '! grep -nE "REACT_APP_GOOGLE|AIzaSy" "$@"' --
        language: system
        files: ^ui/src/

      - id: python-syntax
        name: Check Python syntax
        entry: python3 scripts/check_python_syntax.py
        language: system
        files: ^api/.*\.py$

      - id: eslint
        name: ESLint
        entry: ui/node_modules/.bin/eslint --fix
        language: system
        files: ^ui/src/.*\.[jt]sx?$
        types: [file]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^helm-chart/templates/
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        files: ^api/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^ui/src/.*\.[jt]sx?$
        args: [--use-tabs, --no-cache]
